<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" fill="none">
  <defs>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="streamShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowStream" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#818cf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="25" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="16" font-weight="800">Architektura Spark Streaming + Kafka</text>

  <!-- Data Sources (left) -->
  <g filter="url(#streamShadow)">
    <rect x="15" y="55" width="100" height="40" rx="8" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1"/>
    <text x="65" y="80" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="10" font-weight="600">IoT sensory</text>
  </g>
  <g filter="url(#streamShadow)">
    <rect x="15" y="105" width="100" height="40" rx="8" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1"/>
    <text x="65" y="130" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="10" font-weight="600">Logi serwisów</text>
  </g>
  <g filter="url(#streamShadow)">
    <rect x="15" y="155" width="100" height="40" rx="8" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1"/>
    <text x="65" y="180" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="10" font-weight="600">Kliknięcia web</text>
  </g>

  <!-- Animated data dots flowing to Kafka -->
  <g opacity="0.6">
    <circle cx="130" cy="75" r="3" fill="#ef4444">
      <animate attributeName="cx" values="120;175" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="125" r="2.5" fill="#ef4444">
      <animate attributeName="cx" values="120;175" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="175" r="3" fill="#ef4444">
      <animate attributeName="cx" values="120;175" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Apache Kafka -->
  <g filter="url(#streamShadow)">
    <rect x="175" y="55" width="130" height="150" rx="12" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="240" y="80" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="13" font-weight="700">Apache Kafka</text>
    <text x="240" y="98" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="9">Message Broker</text>
    <line x1="190" y1="106" x2="290" y2="106" stroke="#fbbf24" stroke-opacity="0.2"/>
    <!-- Topics -->
    <rect x="190" y="114" width="100" height="22" rx="4" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="240" y="129" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="8">topic: iot-events</text>
    <rect x="190" y="140" width="100" height="22" rx="4" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="240" y="155" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="8">topic: web-clicks</text>
    <rect x="190" y="166" width="100" height="22" rx="4" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="0.8"/>
    <text x="240" y="181" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="8">topic: logs</text>
  </g>

  <!-- Arrow Kafka → Spark -->
  <g>
    <line x1="310" y1="130" x2="350" y2="130" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowStream)"/>
    <!-- Stream particles -->
    <circle cx="320" cy="125" r="2" fill="#fbbf24" opacity="0.5">
      <animate attributeName="cx" values="315;345" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="135" r="1.5" fill="#fbbf24" opacity="0.4">
      <animate attributeName="cx" values="315;345" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Structured Streaming -->
  <g filter="url(#streamShadow)">
    <rect x="355" y="45" width="180" height="180" rx="14" fill="#4f46e5" stroke="#818cf8" stroke-width="1.5"/>
    <text x="445" y="72" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700">Structured Streaming</text>
    <text x="445" y="89" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="9">Apache Spark</text>
    <line x1="370" y1="96" x2="520" y2="96" stroke="#818cf8" stroke-opacity="0.3"/>

    <!-- Micro-batches visualization -->
    <text x="445" y="115" text-anchor="middle" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="9" font-weight="600">Micro-batches:</text>
    <g>
      <rect x="375" y="122" width="30" height="20" rx="3" fill="#818cf8" opacity="0.3"/><text x="390" y="136" text-anchor="middle" fill="#e0e7ff" font-size="7" font-family="Inter, sans-serif">t₁</text>
      <rect x="410" y="122" width="30" height="20" rx="3" fill="#818cf8" opacity="0.4"/><text x="425" y="136" text-anchor="middle" fill="#e0e7ff" font-size="7" font-family="Inter, sans-serif">t₂</text>
      <rect x="445" y="122" width="30" height="20" rx="3" fill="#818cf8" opacity="0.5"/><text x="460" y="136" text-anchor="middle" fill="#e0e7ff" font-size="7" font-family="Inter, sans-serif">t₃</text>
      <rect x="480" y="122" width="30" height="20" rx="3" fill="#fbbf24" opacity="0.4"/><text x="495" y="136" text-anchor="middle" fill="#fbbf24" font-size="7" font-family="Inter, sans-serif">t₄</text>
    </g>

    <!-- Processing steps -->
    <rect x="375" y="150" width="65" height="22" rx="5" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
    <text x="407" y="165" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="8">Window</text>
    <rect x="448" y="150" width="75" height="22" rx="5" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
    <text x="485" y="165" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="8">Watermark</text>

    <text x="445" y="195" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="9" font-weight="600">Exactly-once</text>
    <text x="445" y="210" text-anchor="middle" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="8">+ Checkpoint</text>
  </g>

  <!-- Arrow Spark → Outputs -->
  <line x1="540" y1="110" x2="575" y2="80" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="540" y1="135" x2="575" y2="135" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="540" y1="160" x2="575" y2="190" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Output sinks -->
  <g filter="url(#streamShadow)">
    <rect x="580" y="55" width="120" height="40" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
    <text x="640" y="75" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="9" font-weight="600">Dashboard</text>
    <text x="640" y="88" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="7" opacity="0.7">real-time</text>
  </g>
  <g filter="url(#streamShadow)">
    <rect x="580" y="110" width="120" height="40" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
    <text x="640" y="130" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="9" font-weight="600">Baza danych</text>
    <text x="640" y="143" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="7" opacity="0.7">Cassandra / BigQuery</text>
  </g>
  <g filter="url(#streamShadow)">
    <rect x="580" y="170" width="120" height="40" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
    <text x="640" y="190" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="9" font-weight="600">Alerty</text>
    <text x="640" y="203" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="7" opacity="0.7">anomalia → email</text>
  </g>

  <!-- Section labels -->
  <text x="65" y="47" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="9" font-weight="600" opacity="0.7">ŹRÓDŁA</text>
  <text x="240" y="47" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="9" font-weight="600" opacity="0.7">BROKER</text>
  <text x="445" y="38" text-anchor="middle" fill="#818cf8" font-family="Inter, sans-serif" font-size="9" font-weight="600" opacity="0.7">PRZETWARZANIE</text>
  <text x="640" y="47" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="9" font-weight="600" opacity="0.7">WYNIKI</text>

  <!-- Batch vs Stream comparison at bottom -->
  <g transform="translate(0, 240)">
    <rect x="90" y="10" width="260" height="60" rx="10" fill="#475569" fill-opacity="0.1" stroke="#475569" stroke-width="1"/>
    <text x="220" y="30" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="11" font-weight="700">Batch Processing</text>
    <text x="220" y="48" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="9">minuty–godziny latencji</text>
    <text x="220" y="62" text-anchor="middle" fill="#475569" font-family="Inter, sans-serif" font-size="9">■■■■■■■■■■ pełny dataset</text>

    <rect x="400" y="10" width="260" height="60" rx="10" fill="#4f46e5" fill-opacity="0.08" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="530" y="30" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="11" font-weight="700">Stream Processing</text>
    <text x="530" y="48" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="9">milisekundy–sekundy latencji</text>
    <text x="530" y="62" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="9">▸▸▸ ciągły strumień danych ▸▸▸</text>
  </g>

  <!-- Bottom label -->
  <text x="380" y="330" text-anchor="middle" fill="#6366f1" font-family="Inter, sans-serif" font-size="10" opacity="0.6">Wykład 7 — Spark Streaming i przetwarzanie strumieniowe danych</text>
</svg>