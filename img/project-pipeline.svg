<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" fill="none">
  <defs>
    <filter id="projShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.2"/>
    </filter>
    <marker id="projArrow" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#818cf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="15" font-weight="800">Pipeline projektu zaliczeniowego</text>

  <!-- Step 1: Research -->
  <g filter="url(#projShadow)">
    <rect x="20" y="55" width="110" height="90" rx="12" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/>
    <text x="75" y="80" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="22">🔍</text>
    <text x="75" y="102" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="10" font-weight="700">Cel badawczy</text>
    <text x="75" y="118" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="8" opacity="0.7">pytanie + hipoteza</text>
    <text x="75" y="138" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="8" font-weight="600">10%</text>
  </g>

  <line x1="135" y1="100" x2="155" y2="100" stroke="#818cf8" stroke-width="2" marker-end="url(#projArrow)"/>

  <!-- Step 2: Dataset -->
  <g filter="url(#projShadow)">
    <rect x="160" y="55" width="110" height="90" rx="12" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="215" y="80" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="22">📊</text>
    <text x="215" y="102" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="10" font-weight="700">Dataset</text>
    <text x="215" y="118" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="8" opacity="0.7">50K+ rekordów</text>
    <text x="215" y="133" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="8" opacity="0.7">rzeczywiste dane</text>
  </g>

  <line x1="275" y1="100" x2="295" y2="100" stroke="#818cf8" stroke-width="2" marker-end="url(#projArrow)"/>

  <!-- Step 3: PySpark Processing -->
  <g filter="url(#projShadow)">
    <rect x="300" y="55" width="110" height="90" rx="12" fill="#4f46e5" fill-opacity="0.1" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="355" y="80" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="22">⚡</text>
    <text x="355" y="102" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="10" font-weight="700">PySpark</text>
    <text x="355" y="118" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="8" opacity="0.7">ETL + analiza</text>
    <text x="355" y="133" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="8" opacity="0.7">lub ML model</text>
  </g>

  <line x1="415" y1="100" x2="435" y2="100" stroke="#818cf8" stroke-width="2" marker-end="url(#projArrow)"/>

  <!-- Step 4: Presentation -->
  <g filter="url(#projShadow)">
    <rect x="440" y="55" width="110" height="90" rx="12" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/>
    <text x="495" y="80" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="22">📑</text>
    <text x="495" y="102" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="10" font-weight="700">Prezentacja</text>
    <text x="495" y="118" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="8" opacity="0.7">20–30 slajdów</text>
    <text x="495" y="138" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="8" font-weight="600">30%</text>
  </g>

  <line x1="555" y1="100" x2="575" y2="100" stroke="#818cf8" stroke-width="2" marker-end="url(#projArrow)"/>

  <!-- Step 5: Defense -->
  <g filter="url(#projShadow)">
    <rect x="580" y="55" width="100" height="90" rx="12" fill="#818cf8" fill-opacity="0.1" stroke="#818cf8" stroke-width="1.5"/>
    <text x="630" y="80" text-anchor="middle" fill="#818cf8" font-family="Inter, sans-serif" font-size="22">🎓</text>
    <text x="630" y="102" text-anchor="middle" fill="#818cf8" font-family="Inter, sans-serif" font-size="10" font-weight="700">Obrona</text>
    <text x="630" y="118" text-anchor="middle" fill="#818cf8" font-family="Inter, sans-serif" font-size="8" opacity="0.7">Q&amp;A + demo</text>
    <text x="630" y="138" text-anchor="middle" fill="#818cf8" font-family="Inter, sans-serif" font-size="8" font-weight="600">50%</text>
  </g>

  <!-- Deliverables row -->
  <text x="350" y="178" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="12" font-weight="700">Deliverables</text>

  <g filter="url(#projShadow)">
    <rect x="70" y="195" width="170" height="45" rx="8" fill="#4f46e5" fill-opacity="0.06" stroke="#4f46e5" stroke-width="1"/>
    <text x="155" y="215" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="10" font-weight="600">Jupyter Notebook</text>
    <text x="155" y="230" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="8" opacity="0.6">kod + wyniki + wizualizacje</text>
  </g>

  <g filter="url(#projShadow)">
    <rect x="270" y="195" width="170" height="45" rx="8" fill="#4f46e5" fill-opacity="0.06" stroke="#4f46e5" stroke-width="1"/>
    <text x="355" y="215" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="10" font-weight="600">Prezentacja PDF/PPTX</text>
    <text x="355" y="230" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="8" opacity="0.6">20–30 slajdów z wykresami</text>
  </g>

  <g filter="url(#projShadow)">
    <rect x="470" y="195" width="170" height="45" rx="8" fill="#4f46e5" fill-opacity="0.06" stroke="#4f46e5" stroke-width="1"/>
    <text x="555" y="215" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="10" font-weight="600">Obrona ustna</text>
    <text x="555" y="230" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="8" opacity="0.6">28.06.2026, ~15 min</text>
  </g>

  <!-- Timeline -->
  <text x="350" y="270" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="9">Temat do 17.05.2026   ·   Oddanie: 21.06.2026   ·   Obrona: 28.06.2026</text>

  <!-- Rozmiar/spójność label -->
  <text x="350" y="290" text-anchor="middle" fill="#818cf8" font-family="Inter, sans-serif" font-size="9" font-weight="600" opacity="0.6">Rozmiar i spójność projektu: 20%</text>
</svg>