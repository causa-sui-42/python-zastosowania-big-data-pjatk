<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" fill="none">
  <defs>
    <linearGradient id="scaleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="mllibShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="360" y="25" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="16" font-weight="800">scikit-learn vs Spark MLlib — kiedy co wybrać?</text>

  <!-- scikit-learn side -->
  <g filter="url(#mllibShadow)">
    <rect x="30" y="50" width="310" height="160" rx="14" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="185" y="78" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="14" font-weight="700">scikit-learn</text>
    <text x="185" y="96" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="10" opacity="0.7">Jeden komputer</text>
    <line x1="50" y1="106" x2="320" y2="106" stroke="#fbbf24" stroke-opacity="0.2"/>
    <text x="185" y="126" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Proste API — model.fit(X, y)</text>
    <text x="185" y="146" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Szybki prototyping</text>
    <text x="185" y="166" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Bogaty ekosystem (100+ algorytmów)</text>
    <text x="185" y="190" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="10" font-weight="600">Limit: ~10 GB RAM</text>
  </g>

  <!-- vs divider -->
  <g>
    <circle cx="360" cy="130" r="20" fill="#4f46e5"/>
    <text x="360" y="135" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="800">vs</text>
  </g>

  <!-- MLlib side -->
  <g filter="url(#mllibShadow)">
    <rect x="380" y="50" width="310" height="160" rx="14" fill="#4f46e5" fill-opacity="0.08" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="535" y="78" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="14" font-weight="700">Spark MLlib</text>
    <text x="535" y="96" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="10" opacity="0.7">Klaster rozproszony</text>
    <line x1="400" y1="106" x2="670" y2="106" stroke="#4f46e5" stroke-opacity="0.2"/>
    <text x="535" y="126" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Pipeline API — podobne do sklearn</text>
    <text x="535" y="146" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Skaluje się horyzontalnie</text>
    <text x="535" y="166" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Integracja z Spark SQL + DataFrame</text>
    <text x="535" y="190" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="10" font-weight="600">Skala: terabajty–petabajty</text>
  </g>

  <!-- Scale bar at bottom -->
  <text x="360" y="235" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="9" font-weight="600">ROZMIAR DANYCH</text>
  <rect x="80" y="242" width="560" height="6" rx="3" fill="url(#scaleGrad)" opacity="0.4"/>
  <text x="80" y="258" text-anchor="start" fill="#ef4444" font-family="Inter, sans-serif" font-size="8">KB</text>
  <text x="220" y="258" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="8">MB–GB</text>
  <text x="500" y="258" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="8">TB–PB</text>
  <!-- Threshold marker -->
  <line x1="320" y1="239" x2="320" y2="252" stroke="#64748b" stroke-width="1.5"/>
  <text x="320" y="258" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="7" font-weight="600">~10 GB</text>
</svg>