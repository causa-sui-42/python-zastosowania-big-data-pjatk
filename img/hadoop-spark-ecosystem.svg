<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none">
  <defs>
    <linearGradient id="hadoopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" fill="#4f46e5" font-family="Inter, sans-serif" font-size="16" font-weight="800">Ekosystem Hadoop + Spark</text>

  <!-- YARN Layer (bottom) -->
  <g filter="url(#shadow)">
    <rect x="40" y="320" width="640" height="70" rx="12" fill="#312e81"/>
    <text x="360" y="348" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="14" font-weight="700">YARN — Resource Manager</text>
    <text x="360" y="372" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="11">Zarządzanie zasobami klastra (CPU, RAM, kontenery)</text>
  </g>

  <!-- HDFS Layer -->
  <g filter="url(#shadow)">
    <rect x="40" y="230" width="640" height="70" rx="12" fill="url(#hadoopGrad)"/>
    <text x="360" y="258" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="700">HDFS — Hadoop Distributed File System</text>
    <text x="360" y="280" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="11">Rozproszone przechowywanie danych — bloki 128 MB, replikacja 3×</text>
    <!-- Block visualization -->
    <g>
      <rect x="110" y="262" width="35" height="25" rx="3" fill="#818cf8" opacity="0.4"/>
      <rect x="150" y="262" width="35" height="25" rx="3" fill="#818cf8" opacity="0.4"/>
      <rect x="190" y="262" width="35" height="25" rx="3" fill="#818cf8" opacity="0.4"/>
      <text x="162" y="297" text-anchor="middle" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="7">bloki danych</text>
    </g>
    <g>
      <rect x="496" y="262" width="35" height="25" rx="3" fill="#818cf8" opacity="0.4"/>
      <rect x="536" y="262" width="35" height="25" rx="3" fill="#818cf8" opacity="0.4"/>
      <rect x="576" y="262" width="35" height="25" rx="3" fill="#818cf8" opacity="0.4"/>
      <text x="536" y="297" text-anchor="middle" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="7">repliki</text>
    </g>
  </g>

  <!-- Processing layer -->
  <!-- MapReduce (legacy) -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="190" height="90" rx="12" fill="#475569"/>
    <text x="135" y="148" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" font-weight="700">MapReduce</text>
    <text x="135" y="168" text-anchor="middle" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Map → Shuffle → Reduce</text>
    <text x="135" y="195" text-anchor="middle" fill="#ef4444" font-family="Inter, sans-serif" font-size="9" font-weight="600">powolny — zapis na dysk</text>
    <!-- Strike-through line -->
    <line x1="60" y1="160" x2="210" y2="160" stroke="#ef4444" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Spark (main) -->
  <g filter="url(#shadow)">
    <rect x="260" y="55" width="210" height="155" rx="14" fill="#4f46e5" stroke="#fbbf24" stroke-width="2"/>
    <text x="365" y="85" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="16" font-weight="800">⚡ Apache Spark</text>
    <line x1="280" y1="96" x2="450" y2="96" stroke="#fbbf24" stroke-opacity="0.3"/>

    <!-- Sub-components -->
    <rect x="278" y="106" width="85" height="30" rx="6" fill="#818cf8" opacity="0.4"/>
    <text x="320" y="125" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="600">Spark SQL</text>

    <rect x="370" y="106" width="85" height="30" rx="6" fill="#818cf8" opacity="0.4"/>
    <text x="412" y="125" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="600">DataFrame</text>

    <rect x="278" y="142" width="85" height="30" rx="6" fill="#818cf8" opacity="0.4"/>
    <text x="320" y="161" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="600">MLlib</text>

    <rect x="370" y="142" width="85" height="30" rx="6" fill="#818cf8" opacity="0.4"/>
    <text x="412" y="161" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="600">Streaming</text>

    <text x="365" y="192" text-anchor="middle" fill="#10b981" font-family="Inter, sans-serif" font-size="10" font-weight="700">in-memory — 100× szybciej</text>
  </g>

  <!-- Ecosystem tools (right) -->
  <g filter="url(#shadow)">
    <rect x="500" y="120" width="180" height="90" rx="12" fill="#3730a3"/>
    <text x="590" y="148" text-anchor="middle" fill="#a5b4fc" font-family="Inter, sans-serif" font-size="12" font-weight="700">Ekosystem</text>
    <g>
      <rect x="515" y="158" width="65" height="22" rx="5" fill="#818cf8" opacity="0.3"/>
      <text x="547" y="173" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="9">Hive</text>
      <rect x="585" y="158" width="80" height="22" rx="5" fill="#818cf8" opacity="0.3"/>
      <text x="625" y="173" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="9">Kafka</text>
      <rect x="515" y="183" width="65" height="22" rx="5" fill="#818cf8" opacity="0.3"/>
      <text x="547" y="198" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="9">HBase</text>
      <rect x="585" y="183" width="80" height="22" rx="5" fill="#818cf8" opacity="0.3"/>
      <text x="625" y="198" text-anchor="middle" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="9">ZooKeeper</text>
    </g>
  </g>

  <!-- Connection arrows (Spark ↔ HDFS) -->
  <g opacity="0.5">
    <path d="M365 210 L365 230" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowY)"/>
    <path d="M135 210 L135 230" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M590 210 L590 230" stroke="#a5b4fc" stroke-width="1.5"/>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowY" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Legend line -->
  <text x="360" y="415" text-anchor="middle" fill="#6366f1" font-family="Inter, sans-serif" font-size="10" opacity="0.6">Wykład 1 — Wprowadzenie do Big Data, Hadoop i Apache Spark</text>
</svg>