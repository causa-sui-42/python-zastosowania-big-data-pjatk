<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG to PNG Converter</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #2d5986; }
        #canvas { border: 1px solid #ddd; margin: 20px 0; display: none; }
        button { background: #2d5986; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #1e3a5f; }
        .svg-box { margin: 20px 0; padding: 20px; background: #f9f9f9; border-radius: 4px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SVG to PNG Converter</h1>
        <p class="status info">This tool converts the SVG diagrams to PNG format. Click each button to download the PNG version.</p>
        
        <div class="svg-box">
            <h3>ml-pipeline.svg</h3>
            <button onclick="convertSVG('ml-pipeline')">Convert & Download PNG</button>
        </div>
        
        <div class="svg-box">
            <h3>gcp-architecture.svg</h3>
            <button onclick="convertSVG('gcp-architecture')">Convert & Download PNG</button>
        </div>
        
        <div class="svg-box">
            <h3>streaming-architecture.svg</h3>
            <button onclick="convertSVG('streaming-architecture')">Convert & Download PNG</button>
        </div>
        
        <div class="svg-box">
            <h3>hadoop-spark-stack.svg</h3>
            <button onclick="convertSVG('hadoop-spark-stack')">Convert & Download PNG</button>
        </div>
        
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const svgFiles = {
            'ml-pipeline': 'presentations/img/ml-pipeline.svg',
            'gcp-architecture': 'presentations/img/gcp-architecture.svg',
            'streaming-architecture': 'presentations/img/streaming-architecture.svg',
            'hadoop-spark-stack': 'presentations/img/hadoop-spark-stack.svg'
        };

        async function convertSVG(name) {
            try {
                const response = await fetch(svgFiles[name]);
                const svgText = await response.text();
                
                const img = new Image();
                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d');
                
                img.onload = () => {
                    // Set canvas size to 2x for better quality
                    canvas.width = img.width * 2 || 1400;
                    canvas.height = img.height * 2 || 360;
                    
                    // Fill white background
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Draw SVG
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // Download PNG
                    canvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${name}.png`;
                        a.click();
                        URL.revokeObjectURL(url);
                        alert(`✓ ${name}.png downloaded! Save it to presentations/img/`);
                    }, 'image/png');
                };
                
                const blob = new Blob([svgText], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                img.src = url;
                
            } catch (error) {
                alert(`Error converting ${name}: ${error.message}`);
            }
        }
    </script>
</body>
</html>
